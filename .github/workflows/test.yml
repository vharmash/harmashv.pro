name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: pnpm/setup@v2
      name: Install pnpm and Node.js
      with:
        version: v11
        runtime: node@latest
        cache: true
        install: true

    - name: Run linter
      run: pnpm lint

    - name: Type check
      run: pnpm type-check

    - name: Run unit tests
      run: pnpm test:unit

    - name: Build project
      run: pnpm build-only

    - name: Run E2E tests on build
      run: pnpm test:e2e
